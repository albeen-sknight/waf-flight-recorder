name: Screenshots

# Manual: starts the real lab, takes browser screenshots of Juice Shop behind
# the WAF, and commits them to docs/screenshots/.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Start the lab
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Wait for Juice Shop behind the WAF
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
            [ "$code" = "200" ] && exit 0; sleep 3
          done
          exit 1

      - name: Install Playwright
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Screenshots with the WAF enforcing
        run: python tools/capture_screenshots.py on

      - name: Screenshots with the WAF in DetectionOnly
        run: |
          WFR_RULE_ENGINE=DetectionOnly docker compose up -d --wait
          sleep 5
          python tools/capture_screenshots.py detection

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet && exit 0
          git commit -m "Screenshots of the lab (real Juice Shop behind the WAF)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Stop the lab
        if: always()
        run: docker compose down -v
