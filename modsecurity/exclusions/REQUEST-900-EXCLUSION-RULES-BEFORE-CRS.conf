# =============================================================================
# Runtime exclusions, loaded BEFORE CRS (and before custom rules)
#
# Rules here use ctl: actions (ruleRemoveById, ruleRemoveTargetById,
# ruleEngine, auditEngine) that change what happens LATER in the same
# transaction, so they must be evaluated before the rules they affect.
#
# Policy: every exclusion is as narrow as possible (one route, one argument,
# one rule), has an ID in 1000-1999, and points to an entry in the tuning journal.
# =============================================================================

# 1000: Infrastructure. the Docker health check (/wfr-health) is answered by
# Apache itself every few seconds. Skip ModSecurity and the audit log for it.
SecRule REQUEST_FILENAME "@streq /wfr-health" \
    "id:1000,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleEngine=Off,\
    ctl:auditEngine=Off"

# 1010: FP-001 (docs/tuning-journal/FP-001.md)
# Customers paste tracking links into feedback comments. "...&utm_source=mail"
# matches CRS 932235 (Unix command injection: "=" prefix + the command "mail").
# Narrowest fix: on POST /api/Feedbacks only, stop 932235 (and only 932235)
# from inspecting ARGS:comment (and only that argument). Every other CRS rule
# still inspects the comment, and 932235 still inspects every other argument
# and every other route.
SecRule REQUEST_METHOD "@streq POST" \
    "id:1010,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ver:'wfr/FP-001',\
    chain"
    SecRule REQUEST_FILENAME "@rx ^/api/feedbacks/?$" \
        "t:none,t:lowercase,\
        ctl:ruleRemoveTargetById=932235;ARGS:comment"
