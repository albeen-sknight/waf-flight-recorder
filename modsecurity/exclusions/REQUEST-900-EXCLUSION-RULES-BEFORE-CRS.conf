# =============================================================================
# Runtime exclusions — loaded BEFORE CRS (and before custom rules)
#
# Rules here use ctl: actions (ruleRemoveById, ruleRemoveTargetById,
# ruleEngine, auditEngine) that change what happens LATER in the same
# transaction, so they must be evaluated before the rules they affect.
#
# Policy: every exclusion is as narrow as possible (one route, one argument,
# one rule), has an ID in 1000-1999, and points to a tuning-journal entry.
# =============================================================================

# 1000 — Infrastructure: the Docker health check (/wfr-health) is answered by
# Apache itself every few seconds. Skip ModSecurity and the audit log for it.
SecRule REQUEST_FILENAME "@streq /wfr-health" \
    "id:1000,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleEngine=Off,\
    ctl:auditEngine=Off"
