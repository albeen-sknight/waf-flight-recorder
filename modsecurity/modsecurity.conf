# =============================================================================
# ModSecurity engine settings (based on Ubuntu's modsecurity.conf-recommended
# for ModSecurity 2.9.7, trimmed and commented for the lab)
# =============================================================================

# -- Engine mode --------------------------------------------------------------
# On            rules run and disruptive actions (deny/block) are enforced
# DetectionOnly rules run and log, nothing is blocked (use for baselining)
# Off           ModSecurity does nothing
# Set with the WFR_RULE_ENGINE environment variable (default: On).
SecRuleEngine ${WFR_RULE_ENGINE}

# -- Request bodies ------------------------------------------------------------
# Needed for phase-2 rules: ARGS from POST bodies, JSON, REQUEST_BODY.
SecRequestBodyAccess On

# Parse XML and JSON bodies so their fields become ARGS. JSON fields are
# named by their path: {"comment": ..} -> ARGS:comment,
# {"a": {"b": ..}} -> ARGS:a.b, {"list": [..]} -> ARGS:list.list
SecRule REQUEST_HEADERS:Content-Type "^(?:application(?:/soap\+|/)|text/)xml" \
     "id:200000,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"
SecRule REQUEST_HEADERS:Content-Type "^application/json" \
     "id:200001,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"

SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject
SecRequestBodyJsonDepthLimit 512

# A body we cannot parse is a body we cannot inspect: refuse it.
SecRule REQBODY_ERROR "!@eq 0" \
    "id:200002,phase:2,t:none,log,deny,status:400,msg:'Failed to parse request body.',logdata:'%{reqbody_error_msg}',severity:2"

SecRule MULTIPART_STRICT_ERROR "!@eq 0" \
    "id:200003,phase:2,t:none,log,deny,status:400, \
    msg:'Multipart request body failed strict validation: \
    PE %{REQBODY_PROCESSOR_ERROR}, \
    BQ %{MULTIPART_BOUNDARY_QUOTED}, \
    BW %{MULTIPART_BOUNDARY_WHITESPACE}, \
    DB %{MULTIPART_DATA_BEFORE}, \
    DA %{MULTIPART_DATA_AFTER}, \
    HF %{MULTIPART_HEADER_FOLDING}, \
    LF %{MULTIPART_LF_LINE}, \
    SM %{MULTIPART_MISSING_SEMICOLON}, \
    IQ %{MULTIPART_INVALID_QUOTING}, \
    IP %{MULTIPART_INVALID_PART}, \
    IH %{MULTIPART_INVALID_HEADER_FOLDING}, \
    FL %{MULTIPART_FILE_LIMIT_EXCEEDED}'"

SecRule MULTIPART_UNMATCHED_BOUNDARY "!@eq 0" \
    "id:200004,phase:2,t:none,log,deny,msg:'Multipart parser detected a possible unmatched boundary.'"

SecPcreMatchLimit 100000
SecPcreMatchLimitRecursion 100000

SecRule TX:/^MSC_/ "!@streq 0" \
    "id:200005,phase:2,t:none,deny,msg:'ModSecurity internal error flagged: %{MATCHED_VAR_NAME}'"

# -- Response bodies -----------------------------------------------------------
# Off for now: the lab studies request inspection first (phases 1-2).
# Turning this on enables CRS RESPONSE-95x data leakage rules (phase 4).
SecResponseBodyAccess Off

# -- Temp / data dirs -----------------------------------------------------------
SecTmpDir /tmp/
SecDataDir /var/cache/modsecurity

# -- Audit log: the lab's "flight recorder" ------------------------------------
# On  = every transaction is recorded, so allowed requests can be studied too.
# JSON, one transaction per line, so tools/ and the tests can parse it.
# Parts: A header, B request headers, C request body, F response headers,
#        H audit trailer (rule messages, action, anomaly info), Z end.
SecAuditEngine On
SecAuditLogFormat JSON
SecAuditLogType Serial
SecAuditLogParts ABCFHZ
SecAuditLogFileMode 0644
SecAuditLog ${WFR_LOG_DIR}/audit.json

# -- Misc --------------------------------------------------------------------
SecArgumentSeparator &
SecCookieFormat 0
SecUnicodeMapFile /etc/modsecurity/unicode.mapping 20127
SecStatusEngine Off
