# =============================================================================
# WAF Flight Recorder — ModSecurity include order
# =============================================================================
#
# READ THIS FILE FIRST. The order below is the order in which ModSecurity
# evaluates rules *within each phase*. Rules run phase by phase (1 request
# headers, 2 request body, 3 response headers, 4 response body, 5 logging);
# inside a phase, they run in the order they were loaded.
#
#   1. Engine settings          modsecurity.conf
#   2. CRS configuration        crs-setup.conf        (paranoia level, thresholds)
#   3. Runtime exclusions       exclusions/REQUEST-900-...   (ctl: actions that must
#                               run BEFORE the CRS rule they change)
#   4. Our own rules            custom-rules/*.conf   (IDs 100000-100999)
#   5. OWASP CRS                ${CRS_HOME}/rules/*.conf   (never edited)
#   6. Configure-time exclusions exclusions/RESPONSE-999-...  (SecRuleRemoveById /
#                               SecRuleUpdateTargetById, which need the CRS rule
#                               to exist already)
#
# Our rules sit before CRS so a direct "deny" in phase 1 or 2 fires before
# CRS evaluates the same phase. Rules that add to the CRS anomaly score must
# run in phase 2, after CRS initialisation (rule 901200, phase 1) has reset
# the score to 0 — see custom-rules/170-anomaly-score-lab.conf.
# =============================================================================

Include ${WFR_HOME}/modsecurity/modsecurity.conf
Include ${WFR_HOME}/modsecurity/crs-setup.conf
Include ${WFR_HOME}/modsecurity/exclusions/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
IncludeOptional ${WFR_HOME}/modsecurity/custom-rules/*.conf
Include ${CRS_HOME}/rules/*.conf
Include ${WFR_HOME}/modsecurity/exclusions/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf
