# =============================================================================
# Lab H — Contributing to the CRS anomaly score          rules 100070, 100071
# =============================================================================
# CRS rules do not deny; they add points to tx.inbound_anomaly_score_pl1 and
# rule 949110 (phase 2) blocks when the total reaches the threshold.
# A local rule can take part in the same scoring instead of denying directly.
#
# The SAME logic written in two phases:
#   100071  phase 1  -> +5 points ... then CRS rule 901200 (phase 1, loaded
#                       AFTER this file) initialises the score to 0. Lost.
#   100070  phase 2  -> +5 points after initialisation -> 949110 blocks.
#
# Lesson: the rule is logically right in both cases; only the phase decides
# whether it has any effect. Scenarios SCORE-002 and SCORE-003.
SecRule ARGS:wfr_score "@streq phase1" \
    "id:100071,\
    phase:1,\
    pass,\
    log,\
    t:none,\
    msg:'WFR lab H: +5 inbound score in PHASE 1 (reset by CRS init)',\
    severity:'CRITICAL',\
    tag:'wfr-lab',\
    tag:'wfr/lab-h-scoring',\
    setvar:'tx.inbound_anomaly_score_pl1=+5'"

SecRule ARGS:wfr_score "@streq phase2" \
    "id:100070,\
    phase:2,\
    pass,\
    log,\
    t:none,\
    msg:'WFR lab H: +5 inbound score in PHASE 2',\
    severity:'CRITICAL',\
    tag:'wfr-lab',\
    tag:'wfr/lab-h-scoring',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"
