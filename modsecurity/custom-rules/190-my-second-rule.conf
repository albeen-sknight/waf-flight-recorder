# My second rule (100090): block product searches longer than 100 characters
#
# REQUEST_FILENAME             where: the page address
# @streq /rest/products/search what: exactly the search page
# id:100090                    my rule's number
# phase:1                      when: at the door (headers, before the body)
# deny                         what to do: stop it
# status:403                   answer "403 Forbidden"
# log                          write it to the audit log
# t:none,t:lowercase           read the address in lowercase first
# msg:'...'                    the message in the log
# logdata:'...'                also log how long the search was
# chain                        AND the next condition must be true too
# ARGS:q                       where: the search text (?q=...)
# @gt 100                      what: is it bigger than 100?
# t:none,t:length              turn the text into its length first ("apple" = 5)
#
# Scenarios: MY-004 (blocked), MY-005 (allowed), MY-006 (other page, allowed)
SecRule REQUEST_FILENAME "@streq /rest/products/search" \
    "id:100090,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    t:none,t:lowercase,\
    msg:'My rule: product search longer than 100 characters',\
    logdata:'length of q: %{MATCHED_VAR}',\
    chain"
    SecRule ARGS:q "@gt 100" \
        "t:none,t:length"