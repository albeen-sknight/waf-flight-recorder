# =============================================================================
# Lab D: Argument inspection                                    rule 100030
# =============================================================================
# Goal: block one named training parameter when it carries a marker value.
#
#   Phase      2. POST/JSON body arguments only exist after the body is read
#              (SecRequestBodyAccess On). In phase 1 only query string ARGS
#              would be visible.
#   Target     ARGS:wfr_marker. ONE argument name, wherever it comes from:
#              query string, form body, or a JSON key at the top level. The JSON
#              body processor (rule 200001) names JSON fields by their path:
#              {"wfr_marker": ..}            -> ARGS:wfr_marker
#              {"outer": {"wfr_marker": ..}} -> ARGS:outer.wfr_marker  (NOT matched)
#              {"list": [..]}                -> ARGS:list.list
#              ARGS (all arguments) would be broader and would fire on the same
#              value in any field (ARG-002 shows that it does not).
#   Operator   @streq, an exact value.
#
# Scenarios: ARG-001..ARG-005
SecRule ARGS:wfr_marker "@streq WFR-ARG-MARKER" \
    "id:100030,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    t:none,\
    msg:'WFR lab: marker value in wfr_marker argument',\
    logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}',\
    severity:'WARNING',\
    tag:'wfr-lab',\
    tag:'wfr/lab-d-argument'"
