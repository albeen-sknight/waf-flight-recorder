# =============================================================================
# Lab B — Header policy                                         rule 100001
# =============================================================================
# Goal: block a harmless, lab-only User-Agent marker.
#
#   Phase      1 (request headers) — headers exist before the body is read,
#              so the decision can be made as early as possible.
#   Target     REQUEST_HEADERS:User-Agent — one header, not all headers.
#   Operator   @contains — substring match, case-sensitive.
#   Transform  t:none — the marker is exact; no normalisation wanted here.
#   Action     deny,status:403 — disruptive; stops the transaction in phase 1,
#              so CRS phase-1/2 rules never run for this request.
#
# Scenarios: scenarios/controls/custom-rules.yaml (HDR-001, HDR-002)
SecRule REQUEST_HEADERS:User-Agent "@contains WFR-Lab-Bot" \
    "id:100001,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    t:none,\
    msg:'WFR lab: bot marker in User-Agent',\
    logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}',\
    severity:'WARNING',\
    tag:'wfr-lab',\
    tag:'wfr/lab-b-header'"
