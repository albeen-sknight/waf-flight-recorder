# =============================================================================
# Lab F: Deliberate false positive, then a narrow fix           rule 100050
# =============================================================================
# History (docs/tuning-journal/LAB-F.md):
#
#   v1 (deliberately too broad):
#       SecRule ARGS "@contains drop" "...t:lowercase,deny..."
#     -> blocked a shopper searching for "cough drops" (false positive)
#
#   v2 (this version): match the SQL statement, not the word.
#     - @rx with word boundaries: "drop" must be a whole word followed by
#       whitespace and TABLE/DATABASE/SCHEMA/VIEW.
#     - t:compressWhitespace so "DROP   TABLE" and "DROP\tTABLE" are one form.
#     - still t:lowercase so "DrOp TaBlE" is caught.
#
#   Regression: LABF-001 ("cough drops") allowed, LABF-002/003 (DROP TABLE,
#   mixed case and extra spaces) blocked by 100050.
SecRule ARGS "@rx \bdrop\s+(?:table|database|schema|view)\b" \
    "id:100050,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    t:none,t:lowercase,t:compressWhitespace,\
    msg:'WFR lab F: SQL DROP statement in an argument',\
    logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}',\
    severity:'CRITICAL',\
    tag:'wfr-lab',\
    tag:'wfr/lab-f-false-positive'"
