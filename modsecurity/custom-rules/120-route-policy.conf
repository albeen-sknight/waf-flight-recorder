# =============================================================================
# Lab C: Rule for one route                                     rule 100020
# Lab E: Transformation experiment                              rule 100040
# =============================================================================
# Goal: Juice Shop exposes a directory listing under /ftp (a known Juice Shop
# "sensitive data exposure" challenge). Patch it virtually at the WAF: deny the
# route, and only that route.
#
#   Phase      1. The path is known from the request line.
#   Target     REQUEST_FILENAME, the path WITHOUT the query string.
#              (REQUEST_URI would include ?query and could be dodged/abused.)
#   Operator   @beginsWith /ftp
#
# Lab E: the same check written twice.
#   100040  t:none                                  -> log only ("naive")
#   100020  t:urlDecodeUni,t:normalizePath,t:lowercase -> deny
# Express (Juice Shop's framework) ignores case in routes, so /FTP, //ftp
# and /./ftp can reach the same handler. The audit log shows which spellings
# the naive rule misses while the normalised rule still catches them
# (scenarios RTE-001..RTE-005). 100040 is loaded first so it is still logged
# when 100020 denies the same request.
SecRule REQUEST_FILENAME "@beginsWith /ftp" \
    "id:100040,\
    phase:1,\
    pass,\
    log,\
    t:none,\
    msg:'WFR lab E: naive /ftp match (t:none) - logging only',\
    logdata:'%{MATCHED_VAR}',\
    severity:'NOTICE',\
    tag:'wfr-lab',\
    tag:'wfr/lab-e-transform'"

SecRule REQUEST_FILENAME "@beginsWith /ftp" \
    "id:100020,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    t:none,t:urlDecodeUni,t:normalizePath,t:lowercase,\
    msg:'WFR lab: /ftp is not public (virtual patch)',\
    logdata:'%{MATCHED_VAR}',\
    severity:'WARNING',\
    tag:'wfr-lab',\
    tag:'wfr/lab-c-route'"
