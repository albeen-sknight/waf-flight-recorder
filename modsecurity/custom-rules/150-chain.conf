# =============================================================================
# Lab G: Chained condition                                      rule 100060
# =============================================================================
# Goal: deleting customer feedback is not allowed through the WAF (a Juice
# Shop challenge abuses DELETE /api/Feedbacks/<id>). Neither condition alone
# is a problem: GET /api/Feedbacks is normal, and DELETE is normal on other
# routes (basket items). Only the COMBINATION is denied.
#
#   chain      the rule matches only if BOTH SecRules match; the disruptive
#              action and metadata live on the first rule of the chain.
#   Phase      1 for both. Method and path are known from the request line.
#
# Scenarios: CHN-001..CHN-003
SecRule REQUEST_METHOD "@streq DELETE" \
    "id:100060,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    t:none,\
    msg:'WFR lab G: DELETE on feedback is not allowed',\
    logdata:'%{REQUEST_METHOD} %{REQUEST_FILENAME}',\
    severity:'WARNING',\
    tag:'wfr-lab',\
    tag:'wfr/lab-g-chain',\
    chain"
    SecRule REQUEST_FILENAME "@beginsWith /api/feedbacks" \
        "t:none,t:urlDecodeUni,t:normalizePath,t:lowercase"
