# =============================================================================
# Lab A: HTTP method policy                                     rule 100010
# =============================================================================
# Goal: Juice Shop never needs WebDAV methods. Refuse them with 405.
#
#   Phase      1. The method is known from the request line.
#   Target     REQUEST_METHOD
#   Operator   @rx anchored with ^...$, so exact method names only.
#   Action     deny,status:405 (Method Not Allowed).
#
# Why not @within? "@within PROPFIND PROPPATCH ..." is a SUBSTRING test:
# it asks "does the method appear anywhere inside this string?". PATCH is a
# substring of PROPPATCH, so @within would also block PATCH, which Juice
# Shop's own frontend uses. Scenario MTH-003 proves PATCH stays allowed.
# (CRS rule 911100 uses @within against tx.allowed_methods; the same caveat
# applies there.)
#
# Scenarios: MTH-001, MTH-002, MTH-003
SecRule REQUEST_METHOD "@rx ^(?:PROPFIND|PROPPATCH|MKCOL|COPY|MOVE|LOCK|UNLOCK)$" \
    "id:100010,\
    phase:1,\
    deny,\
    status:405,\
    log,\
    t:none,\
    msg:'WFR lab: WebDAV method not allowed',\
    logdata:'%{MATCHED_VAR}',\
    severity:'WARNING',\
    tag:'wfr-lab',\
    tag:'wfr/lab-a-method'"
