# =============================================================================
# OWASP CRS setup for the lab (CRS v4.29.0)
#
# Derived from crs-setup.conf.example. Only the settings the lab changes or
# studies are written out; everything else keeps the CRS default. Each
# setting is an experiment knob — see docs/anomaly-scoring-experiment.md.
# =============================================================================

# Default action for CRS rules: log the match and pass. CRS rules do not deny
# on their own; they add to the anomaly score and rule 949110 (phase 2)
# blocks once the inbound score reaches the threshold ("anomaly scoring mode").
SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"

# -- Paranoia level ------------------------------------------------------------
# PL1 = fewest false positives. Raise to 2+ in the V2 experiments.
SecAction \
    "id:900000,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.29.0',\
    setvar:tx.blocking_paranoia_level=1"

# -- Anomaly thresholds ---------------------------------------------------------
# Inbound 5 = one CRITICAL match (5 points) blocks. Set with the
# WFR_INBOUND_THRESHOLD environment variable (default 5) for experiments.
# Severity points: CRITICAL 5, ERROR 4, WARNING 3, NOTICE 2.
SecAction \
    "id:900110,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.29.0',\
    setvar:tx.inbound_anomaly_score_threshold=${WFR_INBOUND_THRESHOLD},\
    setvar:tx.outbound_anomaly_score_threshold=4"

# -- Allowed HTTP methods -------------------------------------------------------
# CRS default: GET HEAD POST OPTIONS. Juice Shop's own frontend also uses PUT,
# PATCH and DELETE (basket updates, address book). Without this line CRS rule
# 911100 blocks those legitimate requests — see docs/tuning-journal/FP-002.md.
SecAction \
    "id:900200,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.29.0',\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

# -- Required: tells CRS this setup file was loaded ------------------------------
SecAction \
    "id:900990,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.29.0',\
    setvar:tx.crs_setup_version=4290"
