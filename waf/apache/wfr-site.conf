# WAF Flight Recorder: Apache virtual host
#
# Client -> Apache:8080 (ModSecurity + CRS + local rules) -> ${BACKEND_URL}
#
# Environment variables (set by waf/entrypoint.sh or tools/native-lab.sh):
#   WFR_HOME, CRS_HOME, WFR_LOG_DIR, BACKEND_URL, WFR_RULE_ENGINE

# --- ModSecurity: everything is loaded from one file, in a fixed order ---
# Server context (some engine directives are not allowed inside a VirtualHost).
Include ${WFR_HOME}/modsecurity/main.conf

<VirtualHost *:8080>
    ServerName localhost

    # --- Evidence: expose ModSecurity's transaction id to the client ---
    # The test runner uses it to find the exact audit log entry for a request.
    Header always set X-WFR-Transaction "%{UNIQUE_ID}e"

    # --- Health check, answered by Apache itself (never proxied) ---
    # ModSecurity skips it (rule 1000 in REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf)
    # so the Docker health check does not flood the audit log.
    Alias /wfr-health ${WFR_HOME}/waf/apache/health.txt
    <Directory ${WFR_HOME}/waf/apache>
        Require all granted
    </Directory>

    # --- Reverse proxy to the target application ---
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        /wfr-health !
    ProxyPass        /  ${BACKEND_URL}/
    ProxyPassReverse /  ${BACKEND_URL}/

    # --- Block pages: make a WAF block unmistakable in the browser ---
    ErrorDocument 403 "WFR-BLOCKED: request denied by ModSecurity (403). See the audit log for this transaction id."
    ErrorDocument 405 "WFR-BLOCKED: method denied by ModSecurity (405). See the audit log for this transaction id."

    # --- Real client IP when traffic arrives through Cloudflare Tunnel ---
    # Enabled in Session C, trusting only the cloudflared container network.
    # RemoteIPHeader CF-Connecting-IP
    # RemoteIPInternalProxy 172.16.0.0/12

    ErrorLog  ${WFR_LOG_DIR}/apache-error.log
    CustomLog ${WFR_LOG_DIR}/apache-access.log "%h %t \"%r\" %>s %b %{UNIQUE_ID}e"
</VirtualHost>
